services:
  - type: web
    name: bnf-analyzer
    runtime: python
    plan: free
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bnf-analyzer-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: bnf-analyzer-db
    plan: basic-256mb
    databaseName: bnf_analyzer
    ipAllowList: []
